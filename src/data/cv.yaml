# ============================================================================
# CV 전용 데이터
#
# 여기에는 사이트의 다른 파일에 없는 것만 둡니다. 중복 관리를 피하기 위해
# CV 페이지(/cv)의 나머지 섹션은 기존 파일을 그대로 재사용합니다.
#
#   Education · Career · Honors & Awards → members.yaml
#   Publications · Conference Presentations → publications.yaml
#   현재 진행 과제 → research.yaml (projects)
#   Teaching → lectures.yaml
#   연구실명 · 연락처 → site.yaml
# ============================================================================

# ── 연구 관심사 ──────────────────────────────────────────────────────────
research_interests:
  - en: >-
      Artificial intelligence (machine / deep learning) based human– and
      brain–machine interfaces
    ko: 인공지능(기계학습·딥러닝) 기반 인간-기계 / 뇌-기계 인터페이스
  - en: Development of new biomedical signal processing algorithms
    ko: 새로운 생체신호 처리 알고리즘 개발
  - en: >-
      Soft, flexible and stretchable electronics · mixed reality (AR/VR) ·
      human body communication
    ko: 소프트·유연·신축성 전자소자 · 혼합현실(AR/VR) · 인체통신

# ── 연구 역량 ────────────────────────────────────────────────────────────
skills:
  - label_en: Research techniques
    label_ko: 연구 기법
    value_en: >-
      Biomedical signal processing & feature extraction, machine / deep
      learning, embedded software development, Android app development,
      circuit design (Altium, KiCad)
    value_ko: >-
      생체신호 처리 및 특징 추출, 기계학습·딥러닝, 임베디드 소프트웨어 개발,
      안드로이드 앱 개발, 회로 설계 (Altium, KiCad)
  - label_en: Programming
    label_ko: 프로그래밍
    value_en: MATLAB, Python, C, C++, Java, Kotlin, Dart
    value_ko: MATLAB, Python, C, C++, Java, Kotlin, Dart
  - label_en: Languages
    label_ko: 언어
    value_en: Korean (native), English (fluent)
    value_ko: 한국어(모국어), 영어(유창)

# ── 학술 활동 (Academic Service) ─────────────────────────────────────────
# 학회 임원·위원 이력은 members.yaml 의 pi.service 에 있습니다 (People 페이지와
