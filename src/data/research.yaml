# ============================================================================
# 연구 분야 — 3개 축(axis) + 진행 중인 과제(projects)
#
# 메인 페이지 Research 섹션은 axes: 의 3개 카드를 그대로 보여줍니다.
# 소주제의 refs: 는 publications.yaml 의 논문 번호(id)이며, 같은 논문이 여러
# 주제에 걸쳐도 됩니다. image: 는 src/assets/ 아래 경로이며,
# image_credit: 을 적으면 그림 아래에 작은 글씨로 출처가 표시됩니다.
# ============================================================================

axes:
  # ── 1. 몸에 닿는 하드웨어 ────────────────────────────────────────────
  - id: onbody
    title_en: Soft On-body Bioelectronics & Sensors
    title_ko: 소프트 온바디 바이오일렉트로닉스 & 센서
    lead_en: >-
      We build the hardware that touches the body — ultrathin, skin-conformal
      electronics comfortable enough to wear all day, and platforms that read
      several signals at once. Comfort is not a nicety here: it decides whether
      the data gets collected at all.
    lead_ko: >-
      몸에 닿는 하드웨어를 만듭니다. 하루 종일 착용해도 편안한 초박막 피부 밀착
      전자소자, 그리고 여러 신호를 한 번에 읽는 플랫폼입니다. 여기서 착용감은
      부가 요소가 아니라 데이터가 모이느냐를 결정하는 조건입니다.
    topics:
      - title_en: Integrated Multi-Sensor Monitoring System
        title_ko: 통합 멀티센서 모니터링 시스템
        text_en: >-
          One wireless platform that reads several body signals at once —
          cardiac, respiratory, thermal and motion. Conditions no single sensor
          can catch, such as dehydration, heat stress or early kidney injury in
          outdoor workers, only become visible when the signals are read
          together.
        text_ko: >-
          심박·호흡·체온·움직임을 하나의 무선 플랫폼에서 동시에 측정합니다.
          탈수나 온열 스트레스, 야외 작업자의 초기 신장 손상처럼 센서 하나로는
          잡히지 않는 상태는 여러 신호를 함께 읽을 때 비로소 드러납니다.
        image: research/multi-sensor.webp
        refs: [16, 23, 15]

      - title_en: Soft Physiological Signal Patch
        title_ko: 소프트 생체신호 패치
        text_en: >-
          Skin-conformal patches built from ultrathin nanomembrane electrodes —
          thin enough to forget you are wearing them. We use them for overnight
          sleep and apnea screening at home and for continuous monitoring
          outside the clinic, where comfort decides whether the data gets
          collected at all.
        text_ko: >-
          초박막 나노멤브레인 전극으로 만든, 착용을 잊을 만큼 얇은 피부 밀착
          패치입니다. 집에서 하룻밤 수면과 수면무호흡을 측정하는 등 병원 밖에서
          오래 쓰는 것을 목표로 합니다. 이런 환경에서는 착용감이 곧 데이터가
          모이느냐 마느냐를 결정합니다.
        image: research/soft-patch.svg
        refs: [9, 19, 8]

      - title_en: Clinical & Bio-Interface Sensing Systems
        title_ko: 임상·생체 인터페이스 센싱 시스템
        text_en: >-
          Sensors that work where access is hardest — inside a stent to follow
          intracranial pressure without surgery, inside a respirator that
          reshapes itself to fit, inside a bioreactor watching a stem-cell
          culture for weeks, and on a patient right through an operation. Each
          one has to survive its environment before it can measure anything.
        text_ko: >-
          접근이 가장 어려운 곳에서 동작하는 센서를 만듭니다. 수술 없이 두개내압을
          추적하는 스텐트 내부 센서, 착용자에 맞춰 스스로 밀착되는 마스크, 몇 주간
          줄기세포 배양을 지켜보는 바이오리액터, 수술 내내 환자에게 붙어 있는
          심전도 패치가 그 예입니다. 무언가를 측정하기 전에 먼저 그 환경을 견뎌야
          하는 센서들입니다.
        image: research/clinical-sensing.svg
        refs: [22, 20, 11, 28]

  # ── 2. 신경·근육 신호로 기계를 잇다 ──────────────────────────────────
  - id: interface
    title_en: Neural & Human–Machine Interfaces
    title_ko: 뇌·신경 및 인간-기계 인터페이스
    lead_en: >-
      We sense and decode signals from the nervous system and the muscles it
      drives, then turn them into control. The goal is an interface that stays
      accurate through a long day of wear, not a few minutes of demonstration.
    lead_ko: >-
      신경계와 그것이 움직이는 근육의 신호를 측정하고 해석해 제어로 바꿉니다.
      몇 분짜리 시연이 아니라 하루 종일 착용해도 정확도를 지키는 인터페이스가
      목표입니다.
    topics:
      - title_en: Everyday Brain Sensors
        title_ko: 일상 속 뇌신호 센서
        text_en: >-
          Micro-scale electrodes that sit between hair follicles rather than on
          top of hair, so EEG stays clean while the wearer moves. Controlling
          motion artifact this way is what turns a brain–computer interface from
          a few minutes in a lab into something usable for hours.
        text_ko: >-
          머리카락 위가 아니라 모낭 사이에 자리 잡는 초소형 전극입니다. 움직이는
          동안에도 뇌파가 흔들리지 않습니다. 이렇게 동작 잡음을 잡아야 뇌-컴퓨터
          인터페이스가 실험실에서의 몇 분이 아니라 몇 시간 쓸 수 있는 기술이
          됩니다.
        image: research/brain-sensor.webp
        image_credit: Adapted from Kim et al., PNAS 2025
        refs: [21, 14]

      - title_en: Human / Brain–Machine Interfaces
        title_ko: 인간-기계 / 뇌-기계 인터페이스
        text_en: >-
          Driving augmented-reality interfaces and machines from the body's own
          signals — brain activity for direct control, and forearm muscle
          activity read by a soft electrode array to recognize hand gestures.
          The hard part is what breaks them in practice: electrodes that shift,
          motion that adds artifact, and accuracy that decays over a long
          session.
        text_ko: >-
          몸이 내는 신호로 증강현실 인터페이스와 기계를 조작합니다. 뇌 활동으로
          직접 제어하기도 하고, 소프트 전극 어레이로 전완부 근전도를 읽어 손동작을
          인식하기도 합니다. 어려운 부분은 실제 사용에서 성능을 깎는 것들입니다 —
          전극이 밀리는 문제, 움직임이 만드는 잡음, 오래 쓸수록 떨어지는 정확도.
        image: research/hmi-forearm-emg.webp
        image_credit: Adapted from Kim et al., Advanced Science 2024
        refs: [21, 10, 4]

  # ── 3. 측정한 신호를 판단으로 ────────────────────────────────────────
  - id: intelligence
    title_en: Biosignal Intelligence for Mental & Physical Health
    title_ko: 정신·신체 건강을 위한 생체신호 지능
    lead_en: >-
      Measuring is only half of it. We turn continuous biosignals into decisions
      — clinical endpoints scored by measurement rather than observation, mental
      and physical state read in real time, and models that still work on the
      same person weeks later.
    lead_ko: >-
      측정은 절반에 불과합니다. 끊임없이 들어오는 생체신호를 판단으로 바꿉니다.
      관찰이 아니라 측정으로 판정하는 임상 지표, 실시간으로 읽는 정신·신체 상태,
      그리고 몇 주 뒤 같은 사람에게도 여전히 동작하는 모델을 지향합니다.
    image: research/signal-pipeline.svg
    topics:
      - title_en: Healthcare Monitoring
        title_ko: 헬스케어 모니터링
        text_en: >-
          Turning a continuous stream of signals into a clinical answer — sleep
          quality and apnea measured at home, intracranial pressure after a
          stent procedure, and drug-trial endpoints scored by measurement
          instead of by observation.
        text_ko: >-
          끊임없이 들어오는 신호를 임상적 판단으로 바꿉니다. 집에서 재는 수면의
          질과 수면무호흡, 스텐트 시술 후의 두개내압, 그리고 관찰이 아니라
          측정으로 판정하는 약물 임상시험 지표 등을 다룹니다.
        refs: [9, 22, 12]

      - title_en: Mental & Physical State and Performance
        title_ko: 정신·신체 상태와 수행능력
        text_en: >-
          Reading stress, drowsiness, fatigue and attention from the body in
          real time, and asking how well they hold up under load — EEG
          neurofeedback that keeps a learner engaged through an online lecture,
          ventilation and hydration tracked in athletes mid-effort. The loop
          closes when the system acts on what it reads instead of only logging
          it.
        text_ko: >-
          스트레스·졸음·피로·집중도를 몸의 신호에서 실시간으로 읽고, 부하 상태에서
          그것이 얼마나 버티는지까지 봅니다. 온라인 강의 중 학습자의 몰입을
          유지시키는 EEG 뉴로피드백, 운동 중인 선수의 환기량·수분 상태 추적이 그
          예입니다. 읽은 결과를 기록만 하지 않고 곧바로 개입으로 되돌릴 때 비로소
          폐루프가 완성됩니다.
        refs: [24, 9, 7, 23, 16]

      - title_en: Emotion Recognition
        title_ko: 감정 인식
        text_en: >-
          Classifying emotion from brain and facial-muscle signals, including
          expressions too brief to see — and checking that the model still works
          on the same person weeks later, which is where most such systems fail.
        text_ko: >-
          뇌파와 얼굴 근전도로 감정을 분류합니다. 눈으로는 알아채기 어려운 짧은
          표정까지 다루며, 같은 사람에게 몇 주 뒤에도 모델이 동작하는지를 함께
          검증합니다. 대부분의 감정 인식 시스템이 무너지는 지점이 바로
          여기입니다.
        refs: [5, 6, 3]

