# 연구실 소개문 (메인 히어로 아래 문단)
intro:
  en: >-
    We develop soft, wearable devices and intelligent systems for measuring and
    interpreting brain and physiological signals. Our goal is to improve human
    health and interaction through real-time monitoring, signal analysis, and
    personalized intervention — from research to real-world impact.
  ko: >-
    우리 연구실은 뇌 신호와 생체 신호를 측정하고 해석하는 소프트 웨어러블 기기와
    지능형 시스템을 개발합니다. 실시간 모니터링, 신호 분석, 개인 맞춤형 중재를 통해
    사람의 건강과 상호작용을 향상시키는 것, 그리고 그 연구를 실제 삶으로
    이어지게 하는 것이 목표입니다.

# ---------------------------------------------------------------------------
# 브랜드 스토리 "Why PONS?" — 메인 페이지 Why PONS? 밴드에 사용
# ---------------------------------------------------------------------------
brand:
  story:
    en: >-
      Our name, **PONS**, stands for *Physiological & On-body Neural Systems* —
      and it is also the brainstem structure that relays signals between the
      brain and the body. In Latin, *pons* means 'bridge.' True to its name, our
      lab builds bridges: between brain and body signals, between humans and
      machines, and between everyday life and healthcare technology.
    ko: >-
      연구실 이름 **PONS**는 *Physiological & On-body Neural Systems*의 약자이자,
      뇌와 몸 사이의 신호를 이어주는 뇌 구조 '뇌교(pons)'의 이름이기도 합니다.
      라틴어로 pons는 '다리'를 뜻합니다. 이름 그대로 우리 연구실은 뇌와 몸의 신호,
      사람과 기계, 일상과 헬스케어 기술을 잇는 다리를 만듭니다.

  # P · O · N · S 이름 풀이 카드 (스토리 바로 아래 4개 카드 그리드)
  cards:
    - letter: P
      word: Physiological
      word_ko: Physiological
      text_en: We measure the body's vital signals — cardiac, respiratory, muscular, and beyond.
      text_ko: 심박·호흡·근육 등 몸이 보내는 생리신호를 측정합니다.
    - letter: O
      word: On-body
      word_ko: On-body
      text_en: We build soft, skin-conformal wearable devices for everyday life.
      text_ko: 일상에서 편안하게 착용하는 소프트 웨어러블 기기를 만듭니다.
    - letter: N
      word: Neural
      word_ko: Neural
      text_en: We sense and decode brain signals, from EEG to brain–computer interfaces.
      text_ko: EEG부터 뇌-컴퓨터 인터페이스까지, 뇌·신경 신호를 측정하고 해석합니다.
    - letter: S
      word: Systems
      word_ko: Systems
      text_en: >-
        We integrate sensing, signal processing, and applications into complete
        systems for health and human–machine interaction.
      text_ko: >-
        센싱·신호처리·응용을 통합해 헬스케어와 인간-기계 상호작용을 위한 시스템을
        완성합니다.

