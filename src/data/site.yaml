# 사이트 메타 설명 (검색엔진 / 카카오톡·페이스북 공유 미리보기에 쓰입니다)
description:
  en: >-
    PONS Lab at Yonsei University Mirae Campus develops soft, wearable
    bioelectronics and intelligent systems that measure and decode brain and
    physiological signals — for real-time health monitoring, brain–computer
    interfaces, and human–machine interaction.
  ko: >-
    연세대학교 미래캠퍼스 뇌·신체·기계 인터페이스 연구실(PONS Lab)은 뇌·생체 신호를
    측정하고 해석하는 소프트 웨어러블 바이오일렉트로닉스와 지능형 시스템을 연구합니다.
    실시간 건강 모니터링, 뇌-컴퓨터 인터페이스, 인간-기계 상호작용을 다룹니다.

