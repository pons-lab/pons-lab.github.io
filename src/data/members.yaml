# ============================================================================
# 구성원 — PI / 대학원생 / 학부연구생 / 알럼나이
#
# 멤버가 들어오거나 나가면 이 파일만 고치면 됩니다.
#   - 새 멤버: 해당 그룹의 members: 아래에 한 항목 추가
#   - 졸업/수료: 해당 항목을 alumni: 로 옮기고 `until` 을 채우기
#   - photo: public/images/people/ 안의 파일 이름 (없으면 이니셜 아바타가 표시됩니다)
#
# 이름 표기: name_ko = 한글 이름, name_en = 영문(로마자) 이름.
#   - 영문(/) 페이지에는 name_en, 한국어(/ko/) 페이지에는 name_ko 가 표시됩니다.
#   - 로마자 표기는 국립국어원 표준 표기법으로 적어둔 것입니다. 본인이 논문·여권에
#     쓰는 표기가 다르면 name_en 만 고치면 됩니다. (예: name_en: Seo-Yeon Yun)
#
# 사진: src/assets/people/ 에 파일을 넣고 photo: people/파일명.jpg 로 적으면 됩니다.
# 비워두면 이름 이니셜이 동그라미로 표시됩니다.
# ============================================================================

pi:
  name_en: Hodam Kim
  name_ko: 김호담
  degree: Ph.D.
  title_en: Assistant Professor
  title_ko: 조교수
  affiliation_en: Division of Biomedical Engineering, Yonsei University Mirae Campus
  affiliation_ko: 연세대학교 미래캠퍼스 의공학부
  email: hodamkim@yonsei.ac.kr
  phone: "+82-33-760-2490"
  office_en: Room 201, Baekun Hall
  office_ko: 백운관 201호
  # 사진: src/assets/ 아래의 경로를 적습니다. 비워두면 이니셜 아바타가 표시됩니다.
  photo: people/pi.jpg
  cv_url: ""
  scholar_url: ""

  bio_en: >-
    Hodam Kim is an Assistant Professor in the Division of Biomedical
    Engineering at Yonsei University Mirae Campus, where he leads PONS Lab. His
    research bridges soft wearable bioelectronics and biosignal intelligence —
    building skin-conformal sensors and the signal-processing systems that turn
    brain and physiological signals into real-time health and human–machine
    applications.
  bio_ko: >-
    김호담 교수는 연세대학교 미래캠퍼스 의공학부 조교수로 뇌·신체·기계 인터페이스
    연구실(PONS Lab)을 이끌고 있습니다. 피부에 밀착되는 소프트 웨어러블 센서와
    생체신호 지능 기술을 함께 연구하며, 뇌·생체 신호를 실시간 헬스케어와
    인간-기계 상호작용으로 이어지게 하는 시스템을 만듭니다.

