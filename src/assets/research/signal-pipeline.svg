    <text x="34" y="21" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#17408f">Health</text>
  </g>
  <g transform="translate(452 82)">
    <rect x="0" y="0" width="88" height="34" rx="9" fill="#e8eefc"/>
    <path d="M10 12h12v10H10zM22 17h6" fill="none" stroke="#2153c4" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="34" y="21" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#17408f">BCI / HMI</text>
  </g>
  <g transform="translate(452 124)">
    <rect x="0" y="0" width="88" height="34" rx="9" fill="#e8eefc"/>
    <circle cx="16" cy="17" r="8" fill="none" stroke="#2153c4" stroke-width="1.7"/>
    <path d="M13 15h.01M19 15h.01M13 20c2 2 4 2 6 0" fill="none" stroke="#2153c4" stroke-width="1.7" stroke-linecap="round"/>
    <text x="34" y="21" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#17408f">Emotion</text>
  </g>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.4" fill="#6b7a94">
    <text x="20" y="36">RAW SIGNAL</text>
    <text x="215" y="30">PROCESSING &amp; LEARNING</text>
    <text x="452" y="26">APPLICATIONS</text>
