<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-label="From raw biosignal to application">
  <rect width="560" height="200" fill="#f4f7fd"/>
  <!-- 1. 잡음 섞인 원신호 -->
  <rect x="20" y="52" width="130" height="80" rx="12" fill="#fff" stroke="#dbe4f5" stroke-width="1.5"/>
  <path d="M32 96l6-9 5 15 6-22 5 18 6-12 5 9 6-16 5 20 6-13 5 10 6-7 5 12 6-16 5 14 6-8 5 5 6-3h8"
        fill="none" stroke="#8fa6d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 2. 신호처리 / 기계학습 -->
  <rect x="215" y="42" width="130" height="100" rx="12" fill="#fff" stroke="#2153c4" stroke-width="2"/>
  <g stroke="#2153c4" stroke-width="1.6" fill="#fff">
    <circle cx="248" cy="70" r="6"/><circle cx="248" cy="92" r="6"/><circle cx="248" cy="114" r="6"/>
    <circle cx="288" cy="81" r="6"/><circle cx="288" cy="103" r="6"/>
    <circle cx="322" cy="92" r="6"/>
  </g>
  <g stroke="#9db4de" stroke-width="1.2" opacity=".85">
    <path d="M254 70l28 11M254 70l28 33M254 92l28-11M254 92l28 11M254 114l28-11M254 114l28-11M294 81l22 11M294 103l22-11"/>
  </g>
  <!-- 3. 깨끗한 출력 -->
  <path d="M368 92h16l6-14 6 28 7-20 6 10 7-4h18" fill="none" stroke="#2153c4"
        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 화살표 -->
  <g stroke="#2153c4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".8">
    <path d="M160 92h44m-8-6l8 6-8 6"/>
    <path d="M355 92h5m-1 0"/>
  </g>
  <!-- 4. 응용 -->
  <g transform="translate(452 40)">
    <rect x="0" y="0" width="88" height="34" rx="9" fill="#e8eefc"/>
    <path d="M16 20c-6-5-10-8-10-12a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 4-4 7-10 12Z"
