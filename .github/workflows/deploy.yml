# main 브랜치에 푸시하면 사이트를 빌드해서 GitHub Pages 로 자동 배포합니다.
# (GitHub 저장소 Settings > Pages 의 Source 가 "GitHub Actions" 여야 합니다)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동으로도 실행할 수 있게

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않고 기다립니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # CV 페이지를 인쇄해 dist/cv-full.pdf 와 dist/cv-short.pdf 를 만든다
      - run: npx playwright install --with-deps chromium

      - run: npm run build
      - run: npm run build:pdf

      # 레이아웃 자동 검사. 겹침·넘침·깨진 링크가 있으면 여기서 실패해
      # 배포까지 가지 않는다. (로컬에서는 npm run qa)
      - name: Layout QA
        run: npm run qa:only

      # 실패했을 때 어떻게 보였는지 확인할 수 있게 스크린샷을 남긴다
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: qa/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
